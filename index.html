<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My Library</title>

  <!-- PWA basics -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#111111">

  <!-- iOS support -->
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <style>
    :root { --bg:#0e0e0e; --fg:#e9e9e9; --muted:#9aa0a6; --card:#171717; --accent:#6ee7b7; }
    html,body { height:100%; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--fg); }
    header { padding:20px 16px; border-bottom:1px solid #222; position:sticky; top:0; background:rgba(14,14,14,.9); backdrop-filter: blur(6px);}
    .wrap { max-width:900px; margin:0 auto; }
    h1 { margin:0 0 6px; font-size:1.5rem; }
    .sub { color:var(--muted); font-size:.95rem; }

    .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(240px,1fr)); gap:14px; padding:18px 16px 48px; }
    .card { background:var(--card); border:1px solid #222; border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:10px; }
    .title { font-weight:600; font-size:1.05rem; line-height:1.3; }
    .meta { color:var(--muted); font-size:.9rem; }
    .desc { color:#cfcfcf; font-size:.95rem; line-height:1.5; }
    .actions { margin-top:auto; display:flex; gap:8px; align-items:center; }
    .btn { display:inline-block; padding:10px 12px; border-radius:10px; border:1px solid #2a2a2a; text-decoration:none; color:var(--fg); }
    .btn.primary { border-color:transparent; background:var(--accent); color:#06281d; font-weight:600; }
    .tag { font-size:.75rem; color:#06281d; background:var(--accent); border-radius:999px; padding:4px 8px; font-weight:600; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>My Library</h1>
      <div class="sub">Pick a book to read. We’ll add chapters & offline reading next.</div>
    </div>
  </header>

  <main class="wrap">
    <section id="books" class="grid" aria-label="Book list"></section>
  </main>

  <script>
    // Simple in-page data for now. Next step: move to books.json.
    const BOOKS = [
      {
        slug: "river-of-stars",
        title: "River of Stars",
        author: "A. K. Farhan",
        desc: "A night-crossing over a silent city where the river remembers every secret."
      },
      {
        slug: "glass-garden",
        title: "The Glass Garden",
        author: "M. Dahlia",
        desc: "A walled sanctuary where plants speak in dreams—and some lies take root."
      },
      {
        slug: "clockwork-sea",
        title: "The Clockwork Sea",
        author: "J. Rahman",
        desc: "Sailors chasing a mechanical tide that rewinds time with every storm."
      }
    ];

    const list = document.getElementById('books');
    list.innerHTML = BOOKS.map(b => `
      <article class="card">
        <div class="title">${b.title}</div>
        <div class="meta">by ${b.author}</div>
        <p class="desc">${b.desc}</p>
        <div class="actions">
          <a class="btn primary" href="/book.html?b=${encodeURIComponent(b.slug)}">Open</a>
          <span class="tag">New</span>
        </div>
      </article>
    `).join('');

    // Keep PWA service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
    }
  </script>
</body>
</html>
