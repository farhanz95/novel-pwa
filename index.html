<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My Novel</title>

  <!-- PWA basics -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#111111">

  <!-- iOS support -->
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; padding: 2rem; line-height: 1.6; }
    .container { max-width: 700px; margin: 0 auto; }
    h1 { margin-bottom: .5rem; }
    .note { color:#666; font-size:.9rem; }
    .card { background:#111; color:#fff; border-radius:12px; padding:1rem 1.25rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>My Novel</h1>
    <p class="note">This is your PWA starter. We’ll add chapters and navigation next.</p>
    <div class="card">
      <p><strong>Chapter 1 (sample)</strong></p>
      <p>The city was quiet—only the river spoke…</p>
    </div>
  </div>

  <script>
    // Register the Service Worker (for offline & PWA behaviors)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>
</body>
</html>
